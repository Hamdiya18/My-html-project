<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem</title>
</head>
<body>
    <h1>Twinkle twinkle little stars</h1>
    <pre>
        Twinkle twinkle little <strong>stars</strong>
        How I wonder what you <u>are</u>
        Up above the world so <em>high</em>
        Like a <i>diamond </i> in the sky

    </pre>
    
</body>
</html>
