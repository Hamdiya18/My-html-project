<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Showcase</title>
</head>

<body>
    <p>The scent of <mark>brewing coffee</mark> drifted <del>through</del> <ins>through</ins> the early morning fog, mingling with the earthy aroma of damp pine
        needles. For a brief, suspended moment, the world felt entirely still and perfect, a quiet oasis before the
        inevitable <small>rush</small> of the day demanded their attention once again.</p>
</body>

</html>
